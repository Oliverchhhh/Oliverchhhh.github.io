name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Inject last commit date
        run: |
          DATE=$(git log -1 --format=%cs 2>/dev/null || date +%Y-%m-%d)
          python3 << PYEOF
import re
date = "$DATE"
with open('data/config.js') as f:
    s = f.read()
s = re.sub(r'lastUpdated: "[^"]+"', 'lastUpdated: "' + date + '"', s)
open('data/config.js', 'w').write(s)
print("Injected date:", date)
PYEOF

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
